<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>$title · $app</title>
<style>
:root { color-scheme: dark; --bg: #04101a; --card: rgba(12,26,38,.78); --line: rgba(120,200,240,.16); --fg: #e8f3f8;
  --muted: #8fa9b6; --dim: #5d7684; --accent: #4fd1ff; --ok: #5ef2b0; --warn: #ffb547; --bad: #ff5f6d;
  --mono: ui-monospace, "SF Mono", Menlo, monospace; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
  background: radial-gradient(1200px 600px at 50% -10%, #0e2a3d 0%, var(--bg) 60%) no-repeat;
  color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
main { width: 100%; max-width: 30rem; }
.brand { margin: 0 0 14px; text-align: center; color: var(--dim); font: 600 11px/1 var(--mono); letter-spacing: .42em; }
.card { padding: 28px 24px 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--card);
  box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.badge { width: 52px; height: 52px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; }
.badge svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ok .badge { color: var(--ok); background: rgba(94,242,176,.1); box-shadow: 0 0 0 1px rgba(94,242,176,.35), 0 0 28px rgba(94,242,176,.18); }
.warn .badge { color: var(--warn); background: rgba(255,181,71,.1); box-shadow: 0 0 0 1px rgba(255,181,71,.35), 0 0 28px rgba(255,181,71,.15); }
.bad .badge { color: var(--bad); background: rgba(255,95,109,.1); box-shadow: 0 0 0 1px rgba(255,95,109,.35), 0 0 28px rgba(255,95,109,.15); }
h1 { margin: 0; text-align: center; font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
.who { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.who b { color: var(--fg); font-weight: 600; }
.who code { font: 13px var(--mono); color: var(--accent); }
.said { margin: 16px 0 0; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.checks { list-style: none; margin: 22px 0 0; padding: 0; border-top: 1px solid var(--line); }
.checks li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dim); }
.c-ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.c-off .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.c-error .dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.name { flex: 1; min-width: 0; font-weight: 550; }
.name small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; overflow-wrap: anywhere; }
.st { color: var(--muted); font-size: 13px; white-space: nowrap; }
.c-ok .st { color: var(--ok); }
.enable { padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,181,71,.45); background: rgba(255,181,71,.08);
  color: var(--warn); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.enable:hover { background: rgba(255,181,71,.16); }
.hint { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,181,71,.25);
  background: rgba(255,181,71,.06); color: #f5dcb5; font-size: 13.5px; }
.notes { margin: 14px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
.notes li + li { margin-top: 4px; }
.actions { margin-top: 22px; display: grid; }
button { padding: 11px 16px; border: 0; border-radius: 11px; background: linear-gradient(180deg, #7fe0ff, #33b6ec);
  color: #02131c; font: 600 14.5px/1 inherit; font-family: inherit; cursor: pointer; }
button:hover { filter: brightness(1.06); }
.foot { margin: 14px 0 0; text-align: center; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>
<main class="$tone">
  <p class="brand">$brand</p>
  <section class="card">
    <div class="badge" aria-hidden="true">$icon</div>
    <h1>$title</h1>
    $who
    $said
    $checks
    $hint
    $notes
    <div class="actions"><button type="button" id="back">Back to $app</button></div>
    <p class="foot">$foot</p>
  </section>
</main>
<script>
document.getElementById("back").addEventListener("click", () => {
  window.close();  // works for a tab the host opened; otherwise go to the host's page
  setTimeout(() => { location.href = "/"; }, 300);
});
</script>
</body>
</html>
